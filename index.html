<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Launcher</title>
    <!-- FontAwesome for High Quality Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-size: 110px;
            --icon-size: 2.8rem;
            --border-radius: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(120, 119, 198, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 119, 198, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(0, 210, 255, 0.08) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .portal-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* Section Styling */
        .section-wrapper {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Icon Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-size), 1fr));
            gap: 2rem;
            justify-items: center;
            align-items: center;
        }

        /* Category Header Minimal Icons */
        .category-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 18px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        /* App Icon Base */
        .app-tile {
            width: var(--card-size);
            height: var(--card-size);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            font-size: var(--icon-size);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .app-tile:hover {
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }

        .app-tile:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Modern Gradient Profiles for Each App */
        /* Official */
        .icon-bus { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); color: #721c24; }
        .icon-election { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .icon-uss { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .icon-fest { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .icon-news { background: linear-gradient(135deg, #f83600 0%, #f9d423 100%); }
        .icon-timetable { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .icon-db { background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%); }
        .icon-ss { background: linear-gradient(135deg, #02aab0 0%, #00cdac 100%); }

        /* Personal */
        .icon-ev-my { background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%); }
        .icon-ev-sister { background: linear-gradient(135deg, #b224ef 0%, #7579ff 100%); }
        .icon-map { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: #501d00; }

        /* Icon Glow Effect on Hover */
        .app-tile::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: var(--border-radius);
            background: inherit;
            filter: blur(15px);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
        }

        .app-tile:hover::after {
            opacity: 0.6;
        }

        /* Device Specific Layout Enhancements */
        @media (max-width: 600px) {
            :root {
                --card-size: 85px;
                --icon-size: 2.2rem;
                --border-radius: 22px;
            }

            .portal-container {
                gap: 2rem;
            }

            .section-wrapper {
                padding: 2rem 1.2rem;
            }

            .app-grid {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        
        <!-- Official Section -->
        <div class="section-wrapper">
            <div class="category-badge">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <div class="app-grid">
                <!-- School Bus -->
                <a href="https://tdtti.github.io/schoolbus/" target="_blank" class="app-tile icon-bus" title="SCHOOL BUS">BUS
                    <i class="fa-solid fa-bus-simple"></i>
                </a>

                <!-- Election -->
                <a href="https://tdtti.github.io/School-Parliament/" target="_blank" class="app-tile icon-election" title="ELECTION">ELECTION
                    <i class="fa-solid fa-check-to-slot"></i>
                </a>

                <!-- USS Portal -->
                <a href="https://tdtti.github.io/TRAILS/" target="_blank" class="app-tile icon-uss" title="USS PORTAL">USS
                    <i class="fa-solid fa-award"></i>
                </a>
                
                <!-- NOON MEAL Portal -->
                <a href="https://tdtti.github.io/meal/" target="_blank" class="app-tile icon-noonmeal" title="NOON MEALPORTAL">MEAL
                    <i class="fa-solid fa-meal"></i>
                </a>

                <!-- School Fest -->
                <a href="https://tdtti.github.io/Uthsav/" target="_blank" class="app-tile icon-fest" title="School Fest">FEST
                    <i class="fa-solid fa-masks-theater"></i>
                </a>

                <!-- News -->
                <a href="https://tdtti.github.io/school-news-2025/" target="_blank" class="app-tile icon-news" title="News">NEWS
                    <i class="fa-solid fa-newspaper"></i>
                </a>

                <!-- Time Table -->
                <a href="https://tdtti.github.io/tdtti/" target="_blank" class="app-tile icon-timetable" title="TIME TABLE">TIMETABLE
                    <i class="fa-solid fa-calendar-days"></i>
                </a>

                <!-- Student Database -->
                <a href="https://tdtti.github.io/tdtti2/" target="_blank" class="app-tile icon-db" title="Student Database">DATABASE
                    <i class="fa-solid fa-address-book"></i>
                </a>

                <!-- Social Science 7 -->
                <a href="https://tdtti.github.io/ss/" target="_blank" class="app-tile icon-ss" title="SOCIAL SCIENCE 7">SS
                    <i class="fa-solid fa-earth-americas"></i>
                </a>
            </div>
        </div>

        <!-- Personal Section -->
        <div class="section-wrapper">
            <div class="category-badge">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="app-grid">
                <!-- Electrical Vehicle Owned -->
                <a href="https://ajith1772.github.io/mpa/" target="_blank" class="app-tile icon-ev-my" title="Electrical Vehicle Owned">MY
                    <i class="fa-solid fa-charging-station"></i>
                </a>

                <!-- Electrical Vehicle Sister -->
                <a href="https://ajith1772.github.io/chellu/" target="_blank" class="app-tile icon-ev-sister" title="Electrical Vehicle Sister">CHELLU
                    <i class="fa-solid fa-bolt-lightning"></i>
                </a>

                <!-- Census Map -->
                <a href="https://ajith1772.github.io/ajith/" target="_blank" class="app-tile icon-map" title="Census Map">MAP
                    <i class="fa-solid fa-map-location-dot"></i>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
